[package]
name = "kokoro-tts-studio"
version = "0.1.0"
description = "Kokoro TTS Studio Desktop Application"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kokoro_tts_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
kokoro-micro = "1.3.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
hound = "3.5"
pitch_shift = "2.1.0"
base64 = "0.22"

[patch.crates-io]
kokoro-micro = { path = "../kokoro-micro" }
