[package]
edition = "2021"
name = "kokoro-micro"
version = "1.3.0"
authors = [
    "Hue & Aye <team@8b.is>",
    "David Valin <hola@davidvalin.com>",
    "mik-tf",
]
build = false
exclude = [
    "*.wav",
    "*.mp3",
    "*.opus",
    "*.flac",
    "target/",
    ".git/",
    ".DS_Store",
    "0.onnx",
    "0.bin",
    "models/",
]
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE",
    "NOTICE",
    "README.md",
    "examples/**/*",
    "assets/fallback.wav",
    "tools/README.md",
    "tools/gen_zh_data.py",
    "tools/gen_ja_data.py",
    "tools/gen_en_data.py",
    "tools/kokoro_vocab.json",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Minimal TTS crate using Kokoro - perfect for embedding in other apps"
homepage = "https://github.com/DavidValin/kokoro-micro"
documentation = "https://docs.rs/kokoro-micro"
readme = "README.md"
keywords = [
    "tts",
    "text-to-speech",
    "kokoro",
    "audio",
    "voice",
]
categories = [
    "multimedia::audio",
    "multimedia",
]
license = "Apache-2.0"
repository = "https://github.com/DavidValin/kokoro-micro"

[features]
cuda = ["ort/cuda"]
default = []

[lib]
name = "kokoro_micro"
path = "src/lib.rs"

[[example]]
name = "check_all_voices"
path = "examples/check_all_voices.rs"

[[example]]
name = "edge_cases"
path = "examples/edge_cases.rs"

[[example]]
name = "phonemes"
path = "examples/phonemes.rs"

[[example]]
name = "say"
path = "examples/say.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[dependencies.hound]
version = "3.5.1"

[dependencies.jieba-rs]
version = "0.10"

[dependencies.jpreprocess]
version = "0.15"
features = ["naist-jdic"]

[dependencies.ndarray]
version = "0.17.2"

[dependencies.ndarray-npy]
version = "0.10.0"

[dependencies.ort]
version = "2.0.0-rc.11"
features = ["ndarray"]

[dependencies.pinyin]
version = "0.11"

[dependencies.reqwest]
version = "0.12"
features = ["rustls-tls"]
default-features = false

[dependencies.tokio]
version = "1.45"
features = [
    "fs",
    "rt",
]

[dev-dependencies.tokio]
version = "1.45"
features = [
    "rt-multi-thread",
    "macros",
]

[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
