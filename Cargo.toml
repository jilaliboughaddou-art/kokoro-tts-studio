[package]
name = "kokoro-tts-app"
version = "0.1.0"
edition = "2021"

[dependencies]
kokoro-micro = "1.3.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
hound = "3.5"
open = "5.3"
pitch_shift = "2.1.0"
base64 = "0.22"

[patch.crates-io]
kokoro-micro = { path = "./kokoro-micro" }
